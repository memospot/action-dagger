name: Release (Tag)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Bun cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun
          path: ~/.bun/install

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Commit dist/index.js
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f dist/index.js
          git diff --staged --quiet || git commit -m "chore: update dist for release ${{ github.ref_name }}"

          # Re-tag to include the dist commit, then force-push.
          # GITHUB_TOKEN pushes don't retrigger workflows, so this is safe.
          TAG="${{ github.ref_name }}"
          git tag -fa "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}" --force

      - name: Update major version tag
        run: |
          VERSION=${{ github.ref_name }}
          MAJOR=${VERSION%%.*}
          git tag -fa "${MAJOR}" -m "Update ${MAJOR} tag"
          git push origin "${MAJOR}" --force

      - name: Update minor version tag
        run: |
          VERSION=${{ github.ref_name }}
          MINOR=${VERSION%.*}
          if [ "$MINOR" != "$VERSION" ]; then
            git tag -fa "${MINOR}" -m "Update ${MINOR} tag"
            git push origin "${MINOR}" --force
          fi

      - name: Create Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
