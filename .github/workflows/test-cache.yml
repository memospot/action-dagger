name: Test Cache

on:
  push:
    branches: ["main"]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable ACTIONS_STEP_DEBUG"
        required: false
        default: false
        type: boolean

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  ACTIONS_STEP_DEBUG: ${{ inputs.debug || false }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun
          path: ~/.bun/install

      - run: bun install
      - run: bun run build

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist
          path: dist/

  # Test caching within the same job (warm cache scenario)
  cache-same-runner:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: "First Run - Cold Cache"
        id: first-run
        uses: ./
        with:
          version: latest
          verb: core
          args: container from --address=alpine with-exec --args apk,add,--no-cache,zip stdout
          cache-key: test-cache-${{ runner.os }}-${{ hashFiles('./dist/index.js') }}
          dagger-flags: "--progress plain"

      - name: "Verify First Run Logs"
        run: |
          echo "Checking for cold cache indicators..."
          echo "Expected: 'No cache found, starting with fresh engine volume'"

      - name: "Second Run - Warm Cache"
        id: second-run
        uses: ./
        with:
          version: latest
          verb: core
          args: container from --address=alpine with-exec --args apk,add,--no-cache,zip stdout
          cache-key: test-cache-${{ runner.os }}-${{ hashFiles('./dist/index.js') }}
          dagger-flags: "--progress plain"

      - name: "Verify Warm Cache Used"
        run: |
          echo "Checking for warm cache indicators..."
          echo "Expected: 'Restored engine cache archive' and 'Engine volume hydrated'"

  # Test caching across different runners (GHA cache scenario)
  cache-generate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      cache-key: ${{ steps.generate.outputs.cache-key }}
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: "Generate Cache"
        id: generate
        uses: ./
        with:
          version: latest
          verb: core
          args: container from --address=alpine with-exec --args apk,add,--no-cache,zip stdout
          cache-key: test-cache-${{ runner.os }}-${{ hashFiles('./dist/index.js') }}
          dagger-flags: "--progress plain"

      - name: "Verify Cache Saved"
        run: |
          echo "Cache generation complete"
          echo "Post-action should have saved cache"

  cache-restore:
    needs: [build, cache-generate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: "Restore Cache"
        id: restore
        uses: ./
        with:
          version: latest
          verb: core
          args: container from --address=alpine with-exec --args apk,add,--no-cache,zip stdout
          cache-key: test-cache-${{ runner.os }}-${{ hashFiles('./dist/index.js') }}
          dagger-flags: "--progress plain"

      - name: "Verify Cache Restored"
        run: |
          echo "Checking for cache restoration..."
          echo "Expected: 'Restored engine cache archive from key:'"
          echo "Expected: 'Engine volume hydrated'"

  # Test direct cache backup (direct mount method)
  cache-direct-backup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: "Generate Direct Cache"
        uses: ./
        with:
          version: latest
          verb: core
          args: container from --address=alpine with-exec --args apk,add,--no-cache,zip stdout
          cache-key: test-cache-direct-${{ runner.os }}-${{ hashFiles('./dist/index.js') }}
          dagger-flags: "--progress plain"

      - name: "Verify Direct Cache Saved"
        run: |
          echo "Direct cache generation complete"

  cache-direct-restore:
    needs: [build, cache-direct-backup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: "Restore Direct Cache"
        uses: ./
        with:
          version: latest
          verb: core
          args: container from --address=alpine with-exec --args apk,add,--no-cache,zip stdout
          cache-key: test-cache-direct-${{ runner.os }}-${{ hashFiles('./dist/index.js') }}
          dagger-flags: "--progress plain"

      - name: "Verify Direct Cache Restored"
        run: |
          echo "Checking for direct cache restoration..."
          echo "Expected: 'Restored engine cache from key:'"
          echo "Expected: 'Engine volume hydrated'"

  # Test explicit cache-mode: direct
  cache-mode-direct:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: "Test Direct Mode - Save"
        uses: ./
        with:
          version: latest
          verb: core
          args: container from --address=alpine with-exec --args apk,add,--no-cache,zip stdout
          cache-key: test-cache-mode-direct-${{ runner.os }}-${{ hashFiles('./dist/index.js') }}
          cache-mode: direct
          dagger-flags: "--progress plain"

      - name: "Verify Direct Mode Logs"
        run: |
          echo "Expected: 'Setting up Dagger Engine cache (mode: direct)'"
          echo "Expected: 'Attempting Direct Cache Save'"

  # Test explicit cache-mode: container
  cache-mode-container:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: "Test Container Mode - Save"
        uses: ./
        with:
          version: latest
          verb: core
          args: container from --address=alpine with-exec --args apk,add,--no-cache,zip stdout
          cache-key: test-cache-mode-container-${{ runner.os }}-${{ hashFiles('./dist/index.js') }}
          cache-mode: container
          dagger-flags: "--progress plain"

      - name: "Verify Container Mode Logs"
        run: |
          echo "Expected: 'Setting up Dagger Engine cache (mode: container)'"
          echo "Expected: 'Attempting Container Cache Save'"

  # Test disabled caching
  cache-disabled:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: "Run with cache disabled"
        uses: ./
        with:
          version: latest
          verb: core
          args: version
          cache-builds: false

      - name: "Verify no cache operations"
        run: |
          echo "When cache-builds=false, should NOT see:"
          echo "  - 'Setting up Dagger Engine cache...'"
          echo "  - 'Restored engine cache archive'"
          echo "  - 'Cache saved'"
