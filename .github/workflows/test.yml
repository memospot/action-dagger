name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # Enable manual trigger for easy debugging
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Bun cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun
          path: ~/.bun/install

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist
          path: dist/

  integration:
    needs: build
    runs-on: ubuntu-latest
    env:
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Execute action and validate output
        id: use-output
        uses: ./
        with:
          version: latest
          verb: core
          args: container from --address=alpine with-exec --args echo,-n,"hello world" stdout
      - name: Check output value
        run: |
          target='${{ steps.use-output.outputs.output }}'
          if [[ "$target" != "hello world" ]]; then
            echo "Expected 'hello world', got: $target"
            exit 1
          fi
          echo "output matches"

      - name: Trace URL with cloud token
        if: ${{ env.DAGGER_CLOUD_TOKEN != '' }}
        id: trace-url-token
        uses: ./
        with:
          version: latest
          verb: core
          args: version
          cloud-token: ${{ env.DAGGER_CLOUD_TOKEN }}
      - name: Check trace URL with token
        if: ${{ env.DAGGER_CLOUD_TOKEN != '' }}
        run: |
          url='${{ steps.trace-url-token.outputs.trace-url }}'
          if [[ "$url" != https://dagger.cloud/* ]]; then
            echo "Expected dagger.cloud trace URL, got: $url"
            exit 1
          fi
          echo "trace-url found: $url"

      - name: Trace URL without cloud token
        id: trace-url-no-token
        uses: ./
        env:
          DAGGER_CLOUD_TOKEN: ""
        with:
          version: latest
          verb: core
          args: version
      - name: Check trace URL without token
        run: |
          url='${{ steps.trace-url-no-token.outputs.trace-url }}'
          if [[ "$url" != "https://dagger.cloud/traces/setup" ]]; then
            echo "Expected setup trace URL, got: $url"
            exit 1
          fi
          echo "trace-url fallback matches"

      - name: Write summary to custom path
        uses: ./
        with:
          version: latest
          verb: core
          args: version
          summary-path: /tmp/custom-summary.md
      - name: Check custom summary content
        run: |
          if [[ ! -s /tmp/custom-summary.md ]]; then
            echo "Custom summary file missing or empty"
            exit 1
          fi

          grep -q "## Command" /tmp/custom-summary.md || {
            echo "Missing command section"
            exit 1
          }
          grep -q "## Dagger trace" /tmp/custom-summary.md || {
            echo "Missing trace section"
            exit 1
          }
          grep -q "## Dagger version" /tmp/custom-summary.md || {
            echo "Missing version section"
            exit 1
          }

      - name: Write summary with GitHub summary enabled
        uses: ./
        with:
          version: latest
          verb: core
          args: version
          enable-github-summary: true
          summary-path: /tmp/github-summary-enabled.md
      - name: Check summary content with GitHub summary enabled
        run: |
          if [[ ! -s /tmp/github-summary-enabled.md ]]; then
            echo "Summary file is missing or empty when enable-github-summary=true"
            exit 1
          fi

          grep -q "## Command" /tmp/github-summary-enabled.md || {
            echo "Missing command section"
            exit 1
          }
          grep -q "## Dagger trace" /tmp/github-summary-enabled.md || {
            echo "Missing trace section"
            exit 1
          }
